services:
  smokeledger-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smokeledger
      POSTGRES_USER: smokeledger
      POSTGRES_PASSWORD: smokeledger
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - smokeledger-data:/var/lib/postgresql/data
      - ./third_party/zetaris/sources/smokeledger/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smokeledger -d smokeledger"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  smokeledger-data:
